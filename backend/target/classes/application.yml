server:
  port: 9080

spring:
  application:
    name: ai-quarrel

  datasource:
    url: jdbc:h2:file:./data/aiquarrel;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: true

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

ai:
  deepseek:
    api-key: sk-1c68e305acc24fdb850251a14f316be6
    base-url: https://api.deepseek.com
    model: deepseek-v4-pro
    timeout: 10000
    max-tokens: 512
    temperature: 1.2

app:
  rate-limit:
    device-qps: 10
    ip-qps: 5
    daily-limit: 5
  content:
    max-scene-length: 200
    content-preview-length: 30
